name: Cloudix Website / Validation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/cloudix-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check website/app.js
      - name: Verify static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          root = Path('website')
          page = (root / 'index.html').read_text(encoding='utf-8')
          for file in ('styles.css', 'app.js', 'assets/favicon.svg', 'assets/og.svg', 'LICENSE'):
              assert (root / file).is_file(), file
          for section in ('fonctionnement','pourquoi','compatibilite','telecharger'):
              assert f'id="{section}"' in page, section
          HTMLParser().feed(page)
          ET.parse(root / 'assets/favicon.svg')
          ET.parse(root / 'assets/og.svg')
          print('Cloudix website static checks passed')
          PY
