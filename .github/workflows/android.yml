name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configure stable signing if secrets are available
        env:
          CLOUDIX_KEYSTORE_B64: ${{ secrets.CLOUDIX_KEYSTORE_B64 }}
          CLOUDIX_STORE_PASSWORD: ${{ secrets.CLOUDIX_STORE_PASSWORD }}
          CLOUDIX_KEY_PASSWORD: ${{ secrets.CLOUDIX_KEY_PASSWORD }}
          CLOUDIX_KEY_ALIAS: ${{ secrets.CLOUDIX_KEY_ALIAS }}
        run: |
          if [[ -n "$CLOUDIX_KEYSTORE_B64" && -n "$CLOUDIX_STORE_PASSWORD" && -n "$CLOUDIX_KEY_PASSWORD" ]]; then
            printf '%s' "$CLOUDIX_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cloudix-release.p12"
            chmod 600 "$RUNNER_TEMP/cloudix-release.p12"
            echo "CLOUDIX_KEYSTORE_PATH=$RUNNER_TEMP/cloudix-release.p12" >> "$GITHUB_ENV"
            echo "CLOUDIX_STORE_PASSWORD=$CLOUDIX_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CLOUDIX_KEY_PASSWORD=$CLOUDIX_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "CLOUDIX_KEY_ALIAS=${CLOUDIX_KEY_ALIAS:-cloudix}" >> "$GITHUB_ENV"
            echo "CLOUDIX_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing secrets: ephemeral debug APK only (not update-compatible)."
          fi
      - name: Audit and compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Build upgrade-compatible release APK
        if: env.CLOUDIX_SIGNED == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release signature
        if: env.CLOUDIX_SIGNED == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release
        if: env.CLOUDIX_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cloudix-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed debug update channel
        if: env.CLOUDIX_SIGNED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Publish the verified stable-key release APK, never the ephemeral debug APK.
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cloudix-debug.apk"
          DIGEST="$(sha256sum "$RUNNER_TEMP/cloudix-debug.apk" | cut -d' ' -f1)"
          VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          # The release and metadata must describe exactly the same signed artifact.
          test -s "$RUNNER_TEMP/cloudix-debug.apk"
          test -n "$DIGEST"
          printf '{"versionCode":%d,"sha256":"%s","url":"https://github.com/1337Detailing/Cloudix/releases/download/debug-latest/cloudix-debug.apk","title":"Build debug #%s"}' "$VERSION_CODE" "$DIGEST" "$GITHUB_RUN_NUMBER" > "$RUNNER_TEMP/update.json"
          if gh release view debug-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload debug-latest "$RUNNER_TEMP/cloudix-debug.apk" "$RUNNER_TEMP/update.json" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create debug-latest "$RUNNER_TEMP/cloudix-debug.apk" "$RUNNER_TEMP/update.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cloudix debug (mise à jour intégrée)" --notes "Canal de test signé en continu. APK vérifiée par l'application avant installation." --prerelease
          fi
      - name: Signing status notice
        if: env.CLOUDIX_SIGNED != 'true'
        run: |
          echo "::warning::Cloudix cannot publish in-app updates without the four stable signing secrets. GitHub Actions APKs are temporary builds; see README signing instructions."
      - name: Upload Cloudix APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloudix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
